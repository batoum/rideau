<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0C53" media="(min-width: 901px)">
  <title>Rideau Partners</title>
  <meta name="description" content="Rideau is a private company operating across financial services, energy, and technology.">
  <link rel="stylesheet" href="/styles.css?v=20261029-3">
</head>

<body class="theme-dark">

  <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="/videos/background.mp4" type="video/mp4">
  </video>

  <!-- TOP -->
  <header class="wrapper">
    <span id="datetime"></span>
  </header>

  <!-- MIDDLE (LOGO LINK FIXED) -->
  <main>
      <img
        src="https://raw.githubusercontent.com/batoum/rideau/main/logo.png"
        alt="logo"
        width="165"
      >
  </main>

 <div class="pre-footer">
   <a href="#" onclick="openMenu(); return false;">Info</a>
</div>
  
  
  <!-- BOTTOM -->
  <footer class="wrapper-b">

    <span class="desktop-only col-left">
      London, UK
    </span>

    <span class="desktop-only col-center">
      Rideau Partners
    </span>

    <span class="desktop-only col-right">
      <a href="mailto:information@rideaupartners.com">
        information@rideaupartners.com
      </a>
    </span>

    <span class="mobile-only">
      Rideau Partners<br>
      <a href="#" onclick="openMenu(); return false;">Info</a>
    </span>

  </footer>
  
  <!-- FULL PAGE MENU OVERLAY -->
<div class="full-overlay" id="menuOverlay" aria-hidden="true">

  <div class="overlay-main">
    <div class="overlay-content">

      <div class="menu-links">
        <a href="/">Home</a><br><br>
        <a href="/info">About</a><br><br>
        <a href="/contact">Contact</a>
      </div>

    </div>
  </div>

  <footer>
    <div class="overlay-close" onclick="closeMenu()">Close</div>
</footer>
  
</div>

  <!-- MENU SCRIPT -->
  <script>
  function openMenu() {
    const overlay = document.getElementById('menuOverlay');
    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('menu-open');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    const overlay = document.getElementById('menuOverlay');
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('menu-open');
    document.body.style.overflow = '';
  }
</script>
  
  <!-- TIME SCRIPT -->
  <script>
    function updateDateTime() {
      const now = new Date();

      const date = now.toLocaleDateString('en-GB', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      const time = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      document.getElementById('datetime').innerHTML =
        time + '&nbsp; &#183; &nbsp;' + date;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>

</body>
</html>
